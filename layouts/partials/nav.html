<nav>
  <ul>
    <li>
      <a href="/">Home</a>
    </li>

    {{ range $name, $taxonomy := .Site.Taxonomies.category }}
      <li class="dropdown">

        <a href="javascript:void(0)" class="dropbtn">
          {{ $name | humanize }}
        </a>

        <div class="dropdown-content">
          {{ range $taxonomy.Pages }}
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          {{ end }}
        </div>

      </li>
    {{ end }}

  </ul>
</nav>
