<nav>
  <ul>
    <li>
      <!-- Hugo uses .Site.BaseURL or just "/" for root -->
      <a href="/">Home</a>
    </li>

    <!-- Loop through categories -->
    {{ range $name, $taxonomy := .Site.Taxonomies.categories }}
      <li class="dropdown">

        <a href="javascript:void(0)" class="dropbtn">
          {{ $name | humanize }}
        </a>

        <div class="dropdown-content">
          <!-- Loop through each post inside this category -->
          {{ range $taxonomy.Pages }}
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          {{ end }}
        </div>

      </li>
    {{ end }}

  </ul>
</nav>
